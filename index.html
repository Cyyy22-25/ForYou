<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Bouquet</title>
<style>
:root{--bg:#f4f1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1f232b}}
:root[data-theme="dark"]{--bg:#1f232b}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{max-width:100%;max-height:100%}
</style></head><body><canvas id="c"></canvas>
<script>
const COLS=120,ROWS=50,CW=10,CH=16,RAMP=".:-=+*o#%@";
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
cv.width=COLS*CW;cv.height=ROWS*CH;
const hash=(a,b)=>{let h=Math.sin(a*127.1+b*311.7)*43758.5453;return h-Math.floor(h)};
const BX=60,BY=44; // bouquet base (col,row)
const flowers=[
 {x:34,y:16,r:11,n:6,c:"#ff6fa8",m:"#ffb3d1"},
 {x:60,y:11,r:12,n:7,c:"#f2f2f2",m:"#ffffff"},
 {x:88,y:17,r:11,n:6,c:"#ff4040",m:"#ff9a9a"},
 {x:48,y:28,r:9,n:5,c:"#ffc400",m:"#fff0a0"},
 {x:76,y:29,r:9,n:6,c:"#b36bff",m:"#e0c2ff"},
 {x:61,y:24,r:8,n:5,c:"#ff9a1f",m:"#ffd28a"}
];
const leaves=[[42,38,12,4,-.5],[80,38,12,4,.5],[52,42,10,3,-.9],[70,42,10,3,.9],[60,36,8,3,0]];
const green=["#2e9e4f","#4fd16f","#78e08f"];
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
// static grid
const grid=[];
for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){
 const X=c,Y=r*1.9;let ch=null,col=null;
 // stems
 for(const f of flowers){if(segDist(X,Y,f.x,f.y*1.9,BX,BY*1.9)<1.4){ch=hash(c,r)>.5?"|":":";col=green[0]}}
 // leaves
 for(const [lx,ly,a,b,rot] of leaves){
  const dx=X-lx,dy=Y-ly*1.9,cs=Math.cos(rot),sn=Math.sin(rot);
  const u=(dx*cs+dy*sn)/a,v=(-dx*sn+dy*cs)/(b*1.9);const d=u*u+v*v;
  if(d<1){const k=Math.floor((1-d)*6+hash(c,r)*3);ch=RAMP[Math.min(9,k+2)].replace("@","%");col=green[Math.floor(hash(r,c)*3)]}}
 // flowers
 for(const f of flowers){
  const dx=X-f.x,dy=Y-f.y*1.9,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
  const R=f.r*1.0,rad=R*(0.6+0.4*Math.abs(Math.cos(f.n*a/2)));
  if(d<R*0.28){ch=hash(c,r)>.5?"@":"o";col="#ffb800"}
  else if(d<rad){const k=Math.floor((1-d/rad)*7+hash(c,r)*3);ch=RAMP[Math.max(3,Math.min(9,k+3))];col=hash(r,c)>.7?f.m:f.c}}
 grid[r][c]=ch?[ch,col]:null}}
const hearts=Array.from({length:14},()=>({x:Math.random()*COLS,y:Math.random()*ROWS,s:.02+Math.random()*.04,p:Math.random()*6}));
ctx.font=CH-2+"px ui-monospace,Menlo,Consolas,monospace";ctx.textBaseline="top";
function frame(t){
 ctx.clearRect(0,0,cv.width,cv.height);
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const g=grid[r][c];if(g){
  const tw=hash(c,r+Math.floor(t/400))>.97?"*":g[0];ctx.fillStyle=g[1];ctx.fillText(tw,c*CW,r*CH)}}
 ctx.fillStyle="#ff6fa8";
 for(const h of hearts){h.y-=h.s;if(h.y<-2){h.y=ROWS+1;h.x=Math.random()*COLS}
  ctx.fillText("♥",(h.x+Math.sin(t/900+h.p)*1.5)*CW,h.y*CH)}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
